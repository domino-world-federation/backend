# Backoffice DWF — fed-bo.pborado.com
#
# Pasang: /etc/nginx/sites-available/fed-bo.pborado.com
#         ln -s ../sites-available/fed-bo.pborado.com /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#
# HTTPS belum ada di berkas ini dengan sengaja: jalankan
# `certbot --nginx -d fed-bo.pborado.com` SESUDAH blok ini hidup, dan certbot
# yang menulis ulang bagian TLS-nya sendiri. Menulisnya tangan lebih dulu
# berarti dua sumber untuk hal yang sama.

server {
    listen 80;
    listen [::]:80;
    server_name fed-bo.pborado.com;

    # `public/`, BUKAN akar project. Menunjuk akar berarti `.env`, `storage/`,
    # dan `vendor/` bisa diunduh siapa pun — kesalahan yang tidak menghasilkan
    # satu pun galat, karena aplikasinya tetap jalan.
    root /home/oredo/dev_html/dwf-backend/public;

    index index.php;
    charset utf-8;

    # Bawaan nginx 1 MB, dan itu MENOLAK unggahan sebelum Laravel melihatnya —
    # yang terlihat pemakainya cuma "413" tanpa penjelasan dari layar mana pun.
    # Dokumen dibatasi 10 MB di `config/dwf.php`, jadi angka ini harus di
    # atasnya. PHP juga: `upload_max_filesize` >= 10M dan `post_max_size` >= 12M
    # di `php.ini`, atau nginx meloloskan berkas yang PHP tolak diam-diam.
    client_max_body_size 12M;

    # ---------------------------------------------------------------- media
    #
    # Sebelum `location /` supaya berkas statis tidak pernah menyentuh PHP.
    # `^~` menang atas regex, jadi urutannya tidak bergantung penempatan.
    location ^~ /storage/ {
        # Nama berkas unggahan 40 karakter ACAK, dan menggantinya selalu
        # menulis nama baru. Satu URL karena itu selalu berisi hal yang sama —
        # itu izin untuk `immutable`, yang menghentikan revalidasi bahkan saat
        # orang menekan Reload.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;

        # Folder unggahan tidak boleh mengeksekusi PHP. Validasi sudah menolak
        # apa pun selain WebP dan PDF lewat mime asli, tapi aturan ini yang
        # menahan kalau suatu saat ada modul baru yang lupa memvalidasi.
        location ~ \.php$ { return 403; }

        try_files $uri =404;
    }

    # Unduhan dokumen TIDAK lewat sini — ia `/media/documents/{id}`, ditangani
    # PHP karena harus memeriksa status tayang tiap permintaan. Jangan
    # menambahkan aturan statis untuk `/media/`.

    # --------------------------------------------------------------- Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # `internal`: hanya bisa dicapai lewat rewrite `try_files` di atas, tidak
    # bisa diminta langsung sebagai `/index.php`. Menutup seluruh kelas
    # permintaan yang mencoba menjalankan berkas PHP lain lewat path.
    location ~ \.php$ {
        internal;

        include snippets/fastcgi-php.conf;
        # Sesuaikan versinya: `ls /run/php/`
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Berkas titik ditolak — kecuali `.well-known`, yang dipakai certbot untuk
    # menerbitkan sertifikatnya.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/fed-bo.access.log;
    error_log  /var/log/nginx/fed-bo.error.log;
}
