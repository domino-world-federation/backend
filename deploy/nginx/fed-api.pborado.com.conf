# API publik DWF — fed-api.pborado.com
#
# Host yang SAMA, aplikasi yang SAMA, tapi hanya `/api` yang dilayani.
# Segalanya yang lain 404: layar login backoffice, dashboard, unggahan — tidak
# satu pun bisa dicapai lewat nama ini.
#
# Kenapa dipisah begini, bukan cukup satu host: nama yang beredar di internet
# (dipanggil situs publik, tercatat di log CDN, ditempel di tiket) berhenti jadi
# nama yang juga membuka pintu masuk admin. Satu salah konfigurasi di masa depan
# — aturan yang terlalu longgar, `location` yang bocor — mengenai permukaan yang
# jauh lebih kecil.

server {
    listen 80;
    listen [::]:80;
    server_name fed-api.pborado.com;

    root /home/oredo/dev_html/dwf-backend/public;
    charset utf-8;

    # Endpoint tulis (kontak, buletin, notifikasi turnamen, laporan integritas)
    # semuanya JSON kecil. Batas kecil di sini adalah batas yang benar: tidak
    # ada satu pun endpoint API yang menerima berkas.
    client_max_body_size 1M;

    # Semua yang bukan `/api` ditolak SEBELUM menyentuh PHP.
    location / {
        return 404;
    }

    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # `internal` bukan pelengkap di sini — ia yang menahan `/index.php?...`
    # dipakai untuk menjangkau route non-API lewat pintu belakang. Tanpa baris
    # itu, `location / { return 404; }` di atas bisa dilewati.
    location ~ \.php$ {
        internal;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # CORS TIDAK disetel di sini. Laravel yang mengaturnya lewat
    # `CORS_ALLOWED_ORIGINS`, dan menambahkannya juga di nginx menghasilkan DUA
    # header `Access-Control-Allow-Origin` — yang ditolak browser mana pun,
    # dengan pesan yang menunjuk ke arah yang salah.

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/fed-api.access.log;
    error_log  /var/log/nginx/fed-api.error.log;
}
